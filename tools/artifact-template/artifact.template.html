<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>urban-observatory // First-Artifact Stage-1 Skeleton // proof-of-assembly</title>

<style>
/*@@SEALED_TOKENS@@*/

/* =========================================================================
   urban-observatory // review-document overlay (Class B output-artifact v3)
   Sealed render: design-system-ASK tokens + base64 fonts, then the document
   register's four modules verbatim, then this overlay, then the renderer's
   geometry stylesheet (MD_CSS in build.py).
   Type: every text style is a design-system-ASK document-register role the
   renderer emits; this overlay sets no family, size, weight, leading,
   tracking or text foreground.
   Geometry: every rule below is zero-specificity (:where) and draws only
   what the register leaves to a consumer.
   Line intensity is the one sanctioned value override: --artifact-line /
   --artifact-line-soft draw UO's own rules (the status rail, the table grid,
   the seal line), never a text foreground, a passage rail or a panel.
   Disclosure: native <details>/<summary> in the design-system disclosure
   treatment, no script.
   Theme: the foundation's: system / auto via prefers-color-scheme, with the
   explicit data-theme override reserved and unused.
   Print: the page prints on its own theme ground (see the print rule below).
   ========================================================================= */

/* ── Class B output-artifact line-intensity overlay. FOREGROUND IS INHERITED:
   no --fg rebind. The foundation hairlines (--line-*) read too faint for
   UO's rules and table lines on the light field, so the scoped
   --artifact-line / --artifact-line-soft carry stronger white lines in light
   and the foundation lavender lines in dark. The dark selectors are the
   foundation's own, so these resolve dark wherever its tokens do. The
   assigned logo-ASK wordmark takes the design system's pairing: white on the
   light gradient, lavender-ASK on the dark one, never the text color. */
:root {
  --artifact-line:      rgba(255, 255, 255, 0.90);
  --artifact-line-soft: rgba(255, 255, 255, 0.55);
  --uo-mark: var(--ask-white);
}
:root[data-theme="dark"],
.theme-dark {
  --artifact-line:      var(--line-1);
  --artifact-line-soft: var(--line-2);
  --uo-mark: var(--ask-lavender-ask);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) {
    --artifact-line:      var(--line-1);
    --artifact-line-soft: var(--line-2);
    --uo-mark: var(--ask-lavender-ask);
  }
}

:where(body) { min-height: 100vh; }
:where(.uo-shell) { max-width: 1120px; margin: 0 auto; padding: var(--space-7) var(--space-6) var(--space-10); }

/* ── Status rail: the document's classification band ────────────────── */
:where(.uo-status-rail) {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3) var(--space-5);
  align-items: center;
  padding: var(--space-3) 0;
  border-top: 1px solid var(--artifact-line);
  border-bottom: 1px solid var(--artifact-line);
}
:where(.uo-status-rail__sep) { display: inline-block; width: 1px; height: 0.9em; background: var(--artifact-line-soft); }

/* ── Mark slot: the assigned wordmark opens the section index ────────── */
:where(.uo-index__mark > .surface-disclosure-label) { display: inline-flex; align-items: center; gap: var(--space-3); }
:where(.uo-mark) { display: block; height: 28px; width: auto; color: var(--uo-mark); }

/* ── The document's identity: names and values ───────────────────────── */
:where(.uo-head__meta) { display: grid; grid-template-columns: max-content 1fr; gap: var(--space-2) var(--space-5); margin: 0; }
:where(.uo-head__meta dd) { margin: 0; }

/* ── Print ──────────────────────────────────────────────────────────────
   The page prints on its own theme ground, as it reads on screen: without this
   the ground drops out, so the light theme's white structural lines vanish on
   white paper and the dark theme's lavender text prints on white. No token is
   rebound for print. It also prints the ground when background graphics are
   turned off in the print dialog. */
@media print {
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ── Responsive ─────────────────────────────────────────────────────── */
@media (max-width: 960px) {
  :where(.uo-shell) { padding: var(--space-6) var(--space-4) var(--space-8); }
}
</style>
</head>
<!--
  TEMPLATE BODY PLACEHOLDER.
  build.py uses only the <head> above (the /*@@SEALED_TOKENS@@*/ marker, which
  it replaces with the token CSS, the embedded fonts and the document
  register's four modules, then this overlay). It appends its geometry
  stylesheet and generates the <body> itself: a .uo-shell > main.uo-md
  wrapper around the rendered parts, the masthead and the seal line. The
  markup below is a minimal example of that shape; it is NOT consumed by the
  renderer and carries no live content.
-->
<body>
<div class="uo-shell">
  <main class="uo-md doc-flow">
    <!-- rendered Markdown body is injected here by build.py -->
  </main>
</div>
</body>
</html>
