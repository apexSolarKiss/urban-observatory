<style>
/*@@SEALED_TOKENS@@*/

/* =========================================================================
   urban-observatory // Tier 3 overlay (per inheritance brief 2026-05-24)
   Instance prefix: .uo-*
   Sealed render: Tier 1 + Tier 2 tokens + base64 fonts inlined above.
   Type scale: 4 levels (H1 / H2 / Body / Fine-print).
   Weights: Inter 200/400, Mono 300/500.
   Disclosure: native <details>/<summary>, no JS.
   Theme: system / auto via prefers-color-scheme; explicit override reserved.
   ========================================================================= */

body { margin: 0; min-height: 100vh; }

/* ── Theme inheritance ───────────────────────────────────────────────
   Default = system / auto via prefers-color-scheme.
   Override = data-theme="dark" or data-theme="light" on :root (reserved).
   No JS toggle. Tier 3 utility tokens (--uo-code-bg, --uo-soft-bg) are
   theme-aware. */
:root {
  --uo-code-bg: rgba(255, 255, 255, 0.18);
  --uo-soft-bg: rgba(255, 255, 255, 0.12);
  /* ── Class B output-artifact line-intensity overlay (design-system-ASK v2
     contract, `040e7ca`). FOREGROUND IS INHERITED — this template adds NO local
     --fg rebind. Since the foundation light-mode ramp landed (design-system PR
     #18 / `f9eed18`), the foundation --fg-1/-2/-3 already resolve to dark ink in
     light (`#6A637F` / `#827399` / `rgba(130,115,153,.62)`) and lavender in dark,
     so base-element prose (p / h1 / h2) inherits the correct color directly —
     the prior local --fg rebind is now redundant and has been dropped.
     The ONE sanctioned Class B override is LINE INTENSITY: report rules / borders
     / table lines / dividers read too faint at the foundation hairline (white
     .45 / .22) on the light field, so the scoped --artifact-line /
     --artifact-line-soft carry stronger white lines in light and inherit the
     foundation lavender lines in dark. These are applied only to the artifact's
     OWN structural elements (by class), never to base elements, so they cannot
     affect inherited prose color. The foundation tokens (--fg-*, --line-*) are
     left untouched. */
  --artifact-line:      rgba(255, 255, 255, 0.90); /* rules · borders · table lines (light) */
  --artifact-line-soft: rgba(255, 255, 255, 0.55); /* fainter dividers (light) */
}
:root[data-theme="dark"] {
  --artifact-line:      var(--line-1);             /* dark: foundation lavender lines read fine */
  --artifact-line-soft: var(--line-2);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) {
    --artifact-line:      var(--line-1);
    --artifact-line-soft: var(--line-2);
  }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-from: var(--ask-ink-light);
    --bg-to:   var(--ask-ink-dark);
    --bg-gradient: linear-gradient(45deg, var(--bg-from) 0%, var(--bg-to) 100%);
    --fg-1: var(--ask-lavender-dark);
    --fg-2: rgba(212, 198, 225, 0.72);
    --fg-3: rgba(212, 198, 225, 0.48);
    --fg-on-card: var(--ask-lavender-dark);
    --line-1: rgba(212, 198, 225, 0.22);
    --line-2: rgba(212, 198, 225, 0.10);
    --line-inverse: rgba(212, 198, 225, 0.16);
    --surface-glass:   rgba(212, 198, 225, 0.06);
    --surface-glass-2: rgba(212, 198, 225, 0.10);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
    --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.55);
    --shadow-glow: 0 0 0 1px rgba(212, 198, 225, 0.18), 0 8px 32px rgba(0, 0, 0, 0.6);
    --uo-code-bg: rgba(212, 198, 225, 0.10);
    --uo-soft-bg: rgba(212, 198, 225, 0.06);
  }
}
:root[data-theme="dark"] {
  --uo-code-bg: rgba(212, 198, 225, 0.10);
  --uo-soft-bg: rgba(212, 198, 225, 0.06);
}

.uo-shell {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-7) var(--space-6) var(--space-10);
}

/* ── Section rhythm ─────────────────────────────────────────────────── */
.uo-section { margin: 0 0 var(--space-9); }
.uo-section-label {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg-3);
  margin: 0 0 var(--space-3);
  display: flex;
  gap: var(--space-3);
  align-items: baseline;
}
.uo-section-label .uo-section-index {
  display: inline-block;
  min-width: 2.2em;
  color: var(--fg-3);
  opacity: 0.7;
}
.uo-section-title {
  font-family: var(--font-sans);
  font-size: 36px;
  font-weight: var(--fw-regular);
  line-height: var(--lh-heading);
  letter-spacing: var(--tracking-tight);
  margin: 0 0 var(--space-5);
  color: var(--fg-1);
  text-wrap: pretty;
}
.uo-section-lede {
  font-size: var(--fs-small);
  font-weight: var(--fw-extralight);
  color: var(--fg-2);
  max-width: 70ch;
  margin: 0 0 var(--space-6);
}

/* ── Document head ──────────────────────────────────────────────────── */
.uo-status-rail {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--fg-2);
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3) var(--space-5);
  align-items: center;
  padding: var(--space-3) 0;
  border-top: 1px solid var(--artifact-line);
  border-bottom: 1px solid var(--artifact-line);
  margin-bottom: var(--space-7);
}
.uo-status-rail__primary { color: var(--fg-1); font-weight: var(--fw-medium); }
.uo-status-rail__sep { display: inline-block; width: 1px; height: 0.9em; background: var(--artifact-line-soft); }

.uo-head { margin: 0 0 var(--space-7); }
.uo-head__eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fg-2);
  margin: 0 0 var(--space-3);
}
.uo-head h1 {
  font-size: 48px;
  font-weight: var(--fw-regular);
  line-height: 1.08;
  letter-spacing: -0.025em;
  margin: 0 0 var(--space-3);
  color: var(--fg-1);
  max-width: 26ch;
}
.uo-head__case-line {
  font-size: var(--fs-small);
  font-weight: var(--fw-extralight);
  color: var(--fg-2);
  max-width: 72ch;
  margin: 0;
}
.uo-head__meta {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: var(--space-2) var(--space-5);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: var(--fw-light);
  color: var(--fg-2);
  max-width: 78ch;
  margin: var(--space-5) 0 0;
}
.uo-head__meta dt {
  color: var(--fg-3);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-size: 11px;
}
.uo-head__meta dd { margin: 0; color: var(--fg-1); }
.uo-head__meta dd code { font-family: var(--font-mono); background: var(--uo-code-bg); padding: 1px 5px; border-radius: var(--radius-xs); }
.uo-head__provenance {
  margin-top: var(--space-5);
  padding: var(--space-4) var(--space-5);
  border-left: 2px solid var(--ask-ui-accent-2);
  background: var(--uo-soft-bg);
  border-radius: var(--radius-sm);
  font-family: var(--font-sans);
  font-size: var(--fs-small);
  font-weight: var(--fw-extralight);
  line-height: 1.55;
  color: var(--fg-2);
  max-width: 78ch;
}
.uo-head__provenance strong { color: var(--fg-1); font-weight: var(--fw-regular); }
.uo-head__provenance p { margin: 0 0 var(--space-3); }
.uo-head__provenance p:last-child { margin-bottom: 0; }
.uo-head__provenance code { font-family: var(--font-mono); font-size: 0.86em; background: var(--uo-code-bg); padding: 1px 5px; border-radius: var(--radius-xs); }

/* ── Reviewer-status banner (render-only; disambiguates review status) ─ */
.uo-reviewer-status {
  margin: 0 0 var(--space-7);
  padding: var(--space-5) var(--space-6);
  border: 1px solid var(--ask-emphasis-cyan);
  border-left: 3px solid var(--ask-emphasis-cyan);
  border-radius: var(--radius-lg);
  background: var(--surface-glass-2);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  box-shadow: 0 0 0 1px rgba(0, 190, 255, 0.28), var(--shadow-lg);
}
.uo-reviewer-status__flag {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ask-emphasis-cyan);
  padding: 4px 10px;
  border: 1px solid var(--ask-emphasis-cyan);
  border-radius: var(--radius-xs);
  margin: 0 0 var(--space-4);
}
.uo-reviewer-status__body {
  font-family: var(--font-sans);
  font-size: var(--fs-small);
  font-weight: var(--fw-extralight);
  line-height: 1.55;
  color: var(--fg-1);
  max-width: 78ch;
}
.uo-reviewer-status__body p { margin: 0 0 var(--space-3); }
.uo-reviewer-status__body p:last-child { margin-bottom: 0; }
.uo-reviewer-status__body strong { color: var(--fg-1); font-weight: var(--fw-regular); }

/* ── Proof-of-assembly banner (read this first) ─────────────────────── */
.uo-proof {
  margin: 0 0 var(--space-9);
  padding: var(--space-6) var(--space-7);
  border: 1px solid var(--ask-emphasis-violet);
  border-left: 3px solid var(--ask-emphasis-violet);
  border-radius: var(--radius-lg);
  background: var(--surface-glass-2);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  box-shadow: 0 0 0 1px rgba(170, 64, 255, 0.30), var(--shadow-lg);
}
.uo-proof__flag {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ask-emphasis-violet);
  padding: 4px 10px;
  border: 1px solid var(--ask-emphasis-violet);
  border-radius: var(--radius-xs);
  margin: 0 0 var(--space-4);
}
.uo-proof__title {
  font-family: var(--font-sans);
  font-size: var(--fs-h3);
  font-weight: var(--fw-light);
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  color: var(--fg-1);
  margin: 0 0 var(--space-4);
  max-width: 60ch;
}
.uo-proof__body {
  font-size: var(--fs-small);
  font-weight: var(--fw-extralight);
  line-height: 1.6;
  color: var(--fg-1);
  max-width: 76ch;
}
.uo-proof__body p { margin: 0 0 var(--space-3); }
.uo-proof__body strong { font-weight: var(--fw-regular); color: var(--fg-1); }
.uo-proof__body em { font-style: italic; color: var(--fg-2); }
.uo-proof__absent {
  list-style: none;
  margin: var(--space-4) 0;
  padding: 0;
  display: grid;
  gap: var(--space-2);
}
.uo-proof__absent li {
  font-size: var(--fs-small);
  font-weight: var(--fw-extralight);
  line-height: 1.5;
  color: var(--fg-1);
  padding: var(--space-2) var(--space-4);
  border: 1px dashed var(--artifact-line);
  border-radius: var(--radius-sm);
  background: var(--uo-soft-bg);
}
.uo-proof__absent .uo-absent-tag {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-3);
  margin-right: var(--space-3);
}

/* ── Generic prose ──────────────────────────────────────────────────── */
.uo-prose {
  font-size: var(--fs-small);
  font-weight: var(--fw-extralight);
  line-height: 1.6;
  color: var(--fg-1);
  max-width: 76ch;
}
.uo-prose p { margin: 0 0 var(--space-4); }
.uo-prose h3 {
  font-family: var(--font-sans);
  font-size: var(--fs-h3);
  font-weight: var(--fw-light);
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  color: var(--fg-1);
  margin: var(--space-6) 0 var(--space-3);
  max-width: 60ch;
}
.uo-prose strong { font-weight: var(--fw-regular); color: var(--fg-1); }
.uo-prose em { font-style: italic; color: var(--fg-2); }
.uo-prose code, .uo-prose .mono {
  font-family: var(--font-mono);
  font-size: 0.86em;
  font-weight: var(--fw-light);
  color: var(--fg-1);
  background: var(--uo-code-bg);
  padding: 1px 6px;
  border-radius: var(--radius-xs);
}
.uo-prose ul, .uo-prose ol { margin: 0 0 var(--space-4); padding-left: 1.3em; }
.uo-prose li { margin-bottom: var(--space-2); }

/* ── Verbatim source quote ──────────────────────────────────────────── */
.uo-quote {
  margin: 0 0 var(--space-4);
  padding: var(--space-4) var(--space-5);
  border-left: 2px solid var(--ask-emphasis-violet);
  background: rgba(170, 64, 255, 0.05);
  border-radius: var(--radius-sm);
}
.uo-quote__label {
  display: block;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ask-emphasis-violet);
  margin: 0 0 var(--space-2);
}
.uo-quote__text {
  font-family: var(--font-sans);
  font-size: var(--fs-small);
  font-weight: var(--fw-regular);
  line-height: 1.55;
  color: var(--fg-1);
  margin: 0;
}

/* ── Data tables ────────────────────────────────────────────────────── */
.uo-data-table {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: var(--fw-light);
  line-height: 1.5;
  color: var(--fg-2);
  border-collapse: collapse;
  width: 100%;
  margin: 0 0 var(--space-4);
}
.uo-data-table caption {
  text-align: left;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-3);
  margin-bottom: var(--space-3);
}
.uo-data-table th,
.uo-data-table td {
  text-align: left;
  padding: var(--space-2) var(--space-4) var(--space-2) 0;
  vertical-align: top;
  border-bottom: 1px solid var(--artifact-line-soft);
}
.uo-data-table td.num, .uo-data-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.uo-data-table th {
  color: var(--fg-3);
  font-weight: var(--fw-medium);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-size: 11px;
  white-space: nowrap;
}
.uo-data-table tr:last-child th,
.uo-data-table tr:last-child td { border-bottom: none; }
.uo-data-table tr.uo-row-key td,
.uo-data-table tr.uo-row-key th { color: var(--fg-1); font-weight: var(--fw-medium); }

/* ── Cards ──────────────────────────────────────────────────────────── */
.uo-card {
  background: var(--surface-glass);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  border: 1px solid var(--artifact-line);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
  box-shadow: var(--shadow-lg);
}

/* ── Bounded-absence callout ────────────────────────────────────────── */
.uo-absence {
  margin: var(--space-4) 0;
  padding: var(--space-4) var(--space-5);
  border: 1px solid var(--artifact-line);
  border-left: 2px solid var(--ask-ui-accent-2);
  background: var(--uo-soft-bg);
  border-radius: var(--radius-sm);
}
.uo-absence__label {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ask-ui-accent-2);
  margin: 0 0 var(--space-3);
}
.uo-absence__list { margin: 0; padding-left: 1.2em; font-size: var(--fs-small); font-weight: var(--fw-extralight); line-height: 1.55; color: var(--fg-1); }
.uo-absence__list li { margin-bottom: var(--space-2); }
.uo-absence__list code { font-family: var(--font-mono); font-size: 0.86em; background: var(--uo-code-bg); padding: 1px 5px; border-radius: var(--radius-xs); }
.uo-absence__list strong { font-weight: var(--fw-regular); color: var(--fg-1); }

/* ── Intervention candidate grid ────────────────────────────────────── */
.uo-cand-cluster-label {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--fg-2);
  margin: var(--space-6) 0 var(--space-3);
  padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--artifact-line-soft);
}
.uo-cand-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.uo-cand-card { padding: var(--space-5) var(--space-6); }
.uo-cand-card__label {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--fg-3);
  margin: 0 0 var(--space-2);
}
.uo-cand-card__title {
  font-size: var(--fs-small);
  font-weight: var(--fw-regular);
  line-height: 1.3;
  color: var(--fg-1);
  margin: 0 0 var(--space-3);
}
.uo-cand-card__body {
  font-size: var(--fs-small);
  font-weight: var(--fw-extralight);
  line-height: 1.55;
  color: var(--fg-2);
  margin: 0 0 var(--space-3);
}
.uo-cand-card__body code { font-family: var(--font-mono); font-size: 0.86em; background: var(--uo-code-bg); padding: 1px 5px; border-radius: var(--radius-xs); color: var(--fg-1); }
.uo-cand-card__why {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: var(--fw-light);
  line-height: 1.55;
  color: var(--fg-3);
  margin: 0;
}
.uo-cand-card__why strong { color: var(--fg-2); font-weight: var(--fw-medium); }

/* ── Assessment chips ───────────────────────────────────────────────── */
.uo-assessment {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 3px 9px;
  border: 1px solid var(--artifact-line);
  border-radius: var(--radius-xs);
  color: var(--fg-1);
}
.uo-assessment--confirmed   { opacity: 0.98; }
.uo-assessment--weakened    { opacity: 0.86; }
.uo-assessment--unresolved  { opacity: 0.62; }
.uo-assessment--nyt         { opacity: 0.46; font-style: italic; }

/* ── Code / preformatted blocks ─────────────────────────────────────── */
.uo-codeblock {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: var(--fw-light);
  line-height: 1.6;
  color: var(--fg-2);
  background: var(--uo-soft-bg);
  border: 1px solid var(--artifact-line-soft);
  border-radius: var(--radius-sm);
  padding: var(--space-4) var(--space-5);
  margin: 0 0 var(--space-4);
  white-space: pre;
  overflow-x: auto;
}
.uo-codeblock__label {
  display: block;
  color: var(--fg-3);
  font-weight: var(--fw-medium);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-size: 11px;
  margin-bottom: var(--space-2);
}

/* ── Section gap markers (the deliberately-absent sections) ─────────── */
.uo-gap {
  margin: 0 0 var(--space-7);
  padding: var(--space-4) var(--space-5);
  border: 1px dashed var(--artifact-line);
  border-radius: var(--radius-md);
  background: transparent;
  display: flex;
  gap: var(--space-4);
  align-items: baseline;
  opacity: 0.72;
}
.uo-gap__index {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--fg-3);
  white-space: nowrap;
  min-width: 9em;
}
.uo-gap__text {
  font-family: var(--font-sans);
  font-size: var(--fs-small);
  font-weight: var(--fw-extralight);
  line-height: 1.5;
  color: var(--fg-2);
  margin: 0;
}
.uo-gap__text strong { color: var(--fg-1); font-weight: var(--fw-regular); }
.uo-gaps-band {
  margin: 0 0 var(--space-9);
}
.uo-gaps-band__intro {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--fg-3);
  margin: 0 0 var(--space-4);
}

/* ── Provenance table ───────────────────────────────────────────────── */
.uo-provenance__table {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: var(--fw-light);
  line-height: 1.55;
  color: var(--fg-2);
  border-collapse: collapse;
  width: 100%;
}
.uo-provenance__table th,
.uo-provenance__table td {
  text-align: left;
  padding: var(--space-2) var(--space-4) var(--space-2) 0;
  vertical-align: top;
  border-bottom: 1px solid var(--artifact-line-soft);
}
.uo-provenance__table th {
  color: var(--fg-3);
  font-weight: var(--fw-medium);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-size: 11px;
  white-space: nowrap;
}
.uo-provenance__table tr:last-child th,
.uo-provenance__table tr:last-child td { border-bottom: none; }

/* ── Progressive disclosure ──────────────────────────────────────────
   Native <details>/<summary>. No JavaScript. Typographic +/– indicator. */
details.uo-details { margin: var(--space-3) 0 0; }
details.uo-details > summary {
  list-style: none;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: var(--fw-medium);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--fg-3);
  padding: var(--space-2) 0;
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  transition: color var(--dur-2) var(--ease-out);
}
details.uo-details > summary::-webkit-details-marker { display: none; }
details.uo-details > summary::before {
  content: "+";
  display: inline-block;
  width: 1em;
  text-align: center;
  font-family: var(--font-mono);
  font-size: var(--fs-small);
  color: var(--fg-3);
}
details.uo-details[open] > summary::before { content: "–"; color: var(--fg-2); }
details.uo-details > summary:hover { color: var(--fg-2); }
details.uo-details[open] > summary { color: var(--fg-2); }
details.uo-details > .uo-details__body {
  padding-top: var(--space-3);
  font-size: var(--fs-small);
  font-weight: var(--fw-extralight);
  line-height: 1.55;
  color: var(--fg-1);
}
details.uo-details > .uo-details__body p { margin: 0 0 var(--space-3); }
details.uo-details > .uo-details__body p:last-child { margin-bottom: 0; }
details.uo-details > .uo-details__body code { font-family: var(--font-mono); font-size: 0.86em; background: var(--uo-code-bg); padding: 1px 5px; border-radius: var(--radius-xs); }

/* ── Disposition block ──────────────────────────────────────────────── */
.uo-disposition {
  padding: var(--space-6) var(--space-7);
  border: 1px solid var(--artifact-line);
  border-left: 2px solid var(--ask-ui-accent-2);
  background: var(--surface-glass);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  border-radius: var(--radius-lg);
}
.uo-disposition__list { margin: var(--space-3) 0 0; padding-left: 1.3em; font-size: var(--fs-small); font-weight: var(--fw-extralight); line-height: 1.5; color: var(--fg-1); }
.uo-disposition__list li { margin-bottom: var(--space-1); }

/* ── Footer ─────────────────────────────────────────────────────────── */
.uo-footer {
  margin-top: var(--space-9);
  padding-top: var(--space-5);
  border-top: 1px solid var(--artifact-line-soft);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: var(--fw-light);
  color: var(--fg-3);
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: var(--space-2) var(--space-5);
  max-width: 96ch;
}
.uo-footer dt { letter-spacing: 0.06em; text-transform: uppercase; }
.uo-footer dd { margin: 0; color: var(--fg-2); }

/* ── Responsive ─────────────────────────────────────────────────────── */
@media (max-width: 960px) {
  .uo-cand-grid { grid-template-columns: 1fr; }
  .uo-shell { padding: var(--space-6) var(--space-4) var(--space-8); }
  .uo-gap { flex-direction: column; gap: var(--space-2); }
}
</style>
